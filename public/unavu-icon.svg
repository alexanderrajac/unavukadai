<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Food Bowl Glow & Icon -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Steam waves -->
    <path d="M210 140 Q 225 105 210 75" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <path d="M256 130 Q 275 90 256 60" fill="none" stroke="#eab308" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M302 140 Q 320 105 302 75" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

    <!-- Bowl Base -->
    <path d="M120 220 L392 220 C388 335 320 375 256 375 C192 375 124 335 120 220 Z" fill="url(#brandGrad)" />
    <!-- Bowl Rim -->
    <ellipse cx="256" cy="220" rx="142" ry="34" fill="#f87171" stroke="#ffffff" stroke-width="6"/>
    <!-- Bowl Food Surface -->
    <ellipse cx="256" cy="220" rx="128" ry="24" fill="#fbbf24"/>
    <!-- Serving Spoon -->
    <path d="M340 180 L390 120 C398 110 412 110 420 118 C428 126 428 140 418 148 L360 215 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Stand Ring -->
    <ellipse cx="256" cy="375" rx="75" ry="14" fill="#dc2626"/>
  </g>

  <!-- Wordmark "UNAVUKADAI" -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">UNAVUKADAI</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" fill="#f59e0b" text-anchor="middle" letter-spacing="3">SOUTH CHENNAI</text>
</svg>
